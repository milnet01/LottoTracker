# mypy settings (LOTTO-0007 u). 3.9 is the floor ruff.toml also targets.
[mypy]
python_version = 3.9
# dbus, gi and PySide6 ship no type stubs.
ignore_missing_imports = True
cache_dir = /dev/null
# Build output: tools/build_apk.sh copies the Python under android/app/build,
# and mypy would read each module twice.
exclude = (^|/)build/
