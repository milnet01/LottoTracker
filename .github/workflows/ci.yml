name: CI

# The runner executes ./local-CI.sh --ci, and nothing else. The list of checks
# lives in that one script so a runner and a developer machine cannot drift
# apart: there is no second copy here to forget to update. What --ci does NOT
# cover, and why, is documented at the top of local-CI.sh - in short, four of
# the seven verifiers need the real SMS dump and the scraped archive, neither
# of which may reach a public runner, and verify_privacy.py silently drops to its weaker
# pattern-only mode without the dump. A green tick here is therefore weaker
# than a green ./local-CI.sh, by construction rather than by accident.

on:
  push:
    branches: [master]
    # Mirrors local-CI.sh's documentation-only skip, so the two agree about
    # what does not need gating.
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # PySide6 links against these at import time; a bare runner has none of
      # them. tools/verify_page.py needs no display (it runs the tray under
      # LWSM_MANAGED=1, which draws no icon) but it does import the module.
      - name: System libraries PySide6 imports against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libgl1

      - name: Python tooling
        run: pip install --disable-pip-version-check ruff PySide6

      - name: The CI lane
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./local-CI.sh --ci
